name: Build Windows EXE
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/armenian-pop-runtime, experiment/four-voice-pack, fix/armenian-stable-playback, feature/separate-text-and-live-bots, review/live-voice-recheck-348]
permissions:
  contents: read
concurrency:
  group: voice-reader-pro-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare bundled tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          New-Item -ItemType Directory -Force tools | Out-Null

          # Do NOT copy the Chocolatey PATH shim from chocolatey/bin.
          # Copy the real ffmpeg executable from the package's tools directory.
          $ffmpegPath = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools/ffmpeg/bin/ffmpeg.exe'
          if (!(Test-Path $ffmpegPath)) {
            throw "Real FFmpeg executable not found at: $ffmpegPath"
          }
          & $ffmpegPath -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Real FFmpeg failed its version check' }
          Copy-Item $ffmpegPath tools/ffmpeg.exe -Force

          # Verify that the copied executable can create a valid Ogg/Opus file.
          $testAudio = Join-Path $PWD 'tools/ffmpeg-smoke-test.ogg'
          & (Join-Path $PWD 'tools/ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.25' -c:a libopus -f opus -y $testAudio
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $testAudio)) { throw 'Bundled FFmpeg Opus smoke test failed' }
          $testBytes = [System.IO.File]::ReadAllBytes($testAudio)
          $magic = [System.Text.Encoding]::ASCII.GetString($testBytes[0..3])
          if ($magic -ne 'OggS') { throw "Bundled FFmpeg produced invalid Ogg header: $magic" }
          Remove-Item $testAudio -Force

          # Create a one-second MP3 fixture for the PCM + libopus smoke test.
          $testMp3 = Join-Path $PWD 'tools/voice-pipeline-smoke.mp3'
          & (Join-Path $PWD 'tools/ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=1' -c:a libmp3lame -b:a 64k -y $testMp3
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $testMp3)) { throw 'Could not create MP3 smoke-test fixture' }

          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile tools/cloudflared.exe
          & (Join-Path $PWD 'tools/cloudflared.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled cloudflared failed its version check' }
      - name: Download local Russian and Armenian-accent Silero models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voices | Out-Null
          Invoke-WebRequest -Uri 'https://models.silero.ai/models/tts/ru/v5_6_ru.pt' -OutFile voices/v5_6_ru.pt
          $ruSize = (Get-Item voices/v5_6_ru.pt).Length
          if ($ruSize -lt 50000000) { throw "Russian Silero model download is incomplete: $ruSize bytes" }

          Invoke-WebRequest -Uri 'https://models.silero.ai/models/tts/ru/v5_cis_base.pt' -OutFile voices/v5_cis_base.pt
          $cisSize = (Get-Item voices/v5_cis_base.pt).Length
          if ($cisSize -lt 50000000) { throw "Silero CIS Armenian model download is incomplete: $cisSize bytes" }

          Copy-Item licenses/SILERO_MODEL_NOTICE.txt voices/SILERO_MODEL_NOTICE.txt
          Copy-Item licenses/SILERO_CIS_MODEL_NOTICE.txt voices/SILERO_CIS_MODEL_NOTICE.txt
          Write-Host "Downloaded Russian Silero model: $ruSize bytes"
          Write-Host "Downloaded Silero CIS Armenian-accent model: $cisSize bytes"
      - name: Check source
        run: python -m compileall -q launcher.py voice_reader tests
      - name: Verify text/live module isolation
        run: python tests/module_isolation_smoke.py
      - name: Test isolated live microphone DSP
        run: python tests/live_audio_smoke.py
      - name: Test Russian number pronunciation
        run: python tests/number_normalizer_smoke.py
      - name: Test eleven voice selector options and Enter behavior
        run: python tests/web_voice_ui_smoke.py
      - name: Verify DAVE 0.2 and Opus voice support
        run: python tests/dave_compat_smoke.py
      - name: Test standard Silero voices and all eastern-accent voice latency
        run: python tests/silero_voice_smoke.py
      - name: Test Jelly Bear pitch and tempo filter
        run: python tests/jelly_bear_filter_smoke.py
      - name: Test additional voice WAV level normalization
        run: python tests/audio_export_smoke.py
      - name: Smoke-test PCM playback path
        run: python tests/voice_pipeline_smoke.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean build.spec
      - name: Smoke-test mode selector UI
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/VoiceReaderPro/VoiceReaderPro.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--launcher-smoke-test') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Mode selector smoke test failed with exit code $($process.ExitCode)" }
      - name: Smoke-test live voice UI and DSP in packaged EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/VoiceReaderPro/VoiceReaderPro.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--live-ui-smoke-test') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Live voice UI/DSP smoke test failed with exit code $($process.ExitCode)" }
      - name: Smoke-test desktop UI and log widget
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/VoiceReaderPro/VoiceReaderPro.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--ui-smoke-test') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Desktop UI smoke test failed with exit code $($process.ExitCode)" }
      - name: Prepare offline voice folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/VoiceReaderPro/voices | Out-Null
          Copy-Item voices/v5_6_ru.pt dist/VoiceReaderPro/voices/v5_6_ru.pt -Force
          Copy-Item voices/v5_cis_base.pt dist/VoiceReaderPro/voices/v5_cis_base.pt -Force
          Copy-Item voices/SILERO_MODEL_NOTICE.txt dist/VoiceReaderPro/voices/SILERO_MODEL_NOTICE.txt -Force
          Copy-Item voices/SILERO_CIS_MODEL_NOTICE.txt dist/VoiceReaderPro/voices/SILERO_CIS_MODEL_NOTICE.txt -Force
          Copy-Item README.md dist/VoiceReaderPro/README.md -Force
      - name: Test voices from a relocated offline package
        run: python tests/packaged_voice_smoke.py --voices-dir dist/VoiceReaderPro/voices
      - name: Smoke-test all eleven voices from the packaged EXE
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/VoiceReaderPro/VoiceReaderPro.exe'
          foreach ($voice in @('normal', 'female', 'cute_girl', 'armenian2', 'armenian3', 'armenian4', 'jelly_bear', 'cartoon', 'villain', 'superhero', 'custom')) {
            $logPath = Join-Path $env:TEMP "VoiceReaderPro-smoke-$voice.log"
            Remove-Item $logPath -Force -ErrorAction SilentlyContinue
            Write-Host "Testing packaged EXE voice: $voice"
            $process = Start-Process -FilePath $exe -ArgumentList @('--voice-smoke-test', $voice) -Wait -PassThru -WindowStyle Hidden
            $exitCode = $process.ExitCode
            if ($exitCode -ne 0) {
              if (Test-Path $logPath) { Get-Content $logPath }
              throw "Packaged EXE voice smoke test failed: $voice (exit code $exitCode)"
            }
            if (!(Test-Path $logPath) -or !(Select-String -Path $logPath -Pattern '^PASS:' -Quiet)) {
              if (Test-Path $logPath) { Get-Content $logPath }
              throw "Packaged EXE did not report successful synthesis: $voice"
            }
            Get-Content $logPath
          }
      - name: Confirm output
        shell: pwsh
        run: |
          if (!(Test-Path dist/VoiceReaderPro/VoiceReaderPro.exe)) { throw 'EXE was not generated in the app folder' }
          if (!(Test-Path 'dist/VoiceReaderPro/_internal/transformers/models/__init__.pyc')) {
            throw 'transformers.models __init__.pyc must be available on disk for TeraTTS dynamic imports'
          }
          if ((Get-Item dist/VoiceReaderPro/VoiceReaderPro.exe).Length -lt 1MB) { throw 'EXE launcher is unexpectedly small' }
          if (!(Test-Path dist/VoiceReaderPro/voices/v5_6_ru.pt)) { throw 'Default/female Silero model is missing' }
          if ((Get-Item dist/VoiceReaderPro/voices/v5_6_ru.pt).Length -lt 50000000) { throw 'Silero model is incomplete' }
          if (!(Test-Path dist/VoiceReaderPro/voices/v5_cis_base.pt)) { throw 'Armenian 2.0 Silero CIS model is missing' }
          if ((Get-Item dist/VoiceReaderPro/voices/v5_cis_base.pt).Length -lt 50000000) { throw 'Armenian 2.0 Silero CIS model is incomplete' }
          if (!(Test-Path dist/VoiceReaderPro/voices/SILERO_CIS_MODEL_NOTICE.txt)) { throw 'Armenian 2.0 model license notice is missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceReaderPro-Offline-Windows
          path: dist/VoiceReaderPro/
          if-no-files-found: error
          retention-days: 14
