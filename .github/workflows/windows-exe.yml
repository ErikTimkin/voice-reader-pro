name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare bundled tools
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          New-Item -ItemType Directory -Force tools | Out-Null

          # Do NOT copy the Chocolatey PATH shim from chocolatey/bin.
          # Copy the real ffmpeg executable from the package's tools directory.
          $ffmpegPath = Join-Path $env:ChocolateyInstall 'lib/ffmpeg/tools/ffmpeg/bin/ffmpeg.exe'
          if (!(Test-Path $ffmpegPath)) {
            throw "Real FFmpeg executable not found at: $ffmpegPath"
          }
          & $ffmpegPath -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'Real FFmpeg failed its version check' }
          Copy-Item $ffmpegPath tools/ffmpeg.exe -Force

          # Verify that the copied executable can create a valid Ogg/Opus file.
          $testAudio = Join-Path $PWD 'tools/ffmpeg-smoke-test.ogg'
          & (Join-Path $PWD 'tools/ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=0.25' -c:a libopus -f opus -y $testAudio
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $testAudio)) { throw 'Bundled FFmpeg Opus smoke test failed' }
          $testBytes = [System.IO.File]::ReadAllBytes($testAudio)
          $magic = [System.Text.Encoding]::ASCII.GetString($testBytes[0..3])
          if ($magic -ne 'OggS') { throw "Bundled FFmpeg produced invalid Ogg header: $magic" }
          Remove-Item $testAudio -Force

          # Create a one-second MP3 fixture for the PCM + libopus smoke test.
          $testMp3 = Join-Path $PWD 'tools/voice-pipeline-smoke.mp3'
          & (Join-Path $PWD 'tools/ffmpeg.exe') -hide_banner -loglevel error -f lavfi -i 'sine=frequency=440:duration=1' -c:a libmp3lame -b:a 64k -y $testMp3
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $testMp3)) { throw 'Could not create MP3 smoke-test fixture' }

          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile tools/cloudflared.exe
          & (Join-Path $PWD 'tools/cloudflared.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled cloudflared failed its version check' }
      - name: Download local Russian voice model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force voices | Out-Null
          Invoke-WebRequest -Uri 'https://models.silero.ai/models/tts/ru/v5_6_ru.pt' -OutFile voices/v5_6_ru.pt
          $modelSize = (Get-Item voices/v5_6_ru.pt).Length
          if ($modelSize -lt 50000000) { throw "Silero model download is incomplete: $modelSize bytes" }
          Copy-Item licenses/SILERO_MODEL_NOTICE.txt voices/SILERO_MODEL_NOTICE.txt
          Write-Host "Downloaded local Silero model: $modelSize bytes"
      - name: Download and prepare additional offline voices
        run: python tools/prepare_additional_voices.py --voices-dir voices --ffmpeg tools/ffmpeg.exe
      - name: Check source
        run: python -m compileall -q voice_reader tests
      - name: Test Russian number pronunciation
        run: python tests/number_normalizer_smoke.py
      - name: Test web voice selector and Enter behavior
        run: python tests/web_voice_ui_smoke.py
      - name: Verify DAVE 0.2 and Opus voice support
        run: python tests/dave_compat_smoke.py
      - name: Test local Silero voices and event loop
        run: python tests/silero_voice_smoke.py
      - name: Test Armenian accent and young pop voices
        run: python tests/additional_voice_smoke.py
      - name: Smoke-test PCM playback path
        run: python tests/voice_pipeline_smoke.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean build.spec
      - name: Prepare offline voice folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/VoiceReaderPro/voices | Out-Null
          Copy-Item voices/v5_6_ru.pt dist/VoiceReaderPro/voices/v5_6_ru.pt -Force
          Copy-Item voices/SILERO_MODEL_NOTICE.txt dist/VoiceReaderPro/voices/SILERO_MODEL_NOTICE.txt -Force

          New-Item -ItemType Directory -Force dist/VoiceReaderPro/voices/teratts | Out-Null
          Copy-Item -Path voices/teratts/* -Destination dist/VoiceReaderPro/voices/teratts -Recurse -Force

          New-Item -ItemType Directory -Force dist/VoiceReaderPro/voices/armenian | Out-Null
          Copy-Item -Path voices/armenian/* -Destination dist/VoiceReaderPro/voices/armenian -Recurse -Force

          New-Item -ItemType Directory -Force dist/VoiceReaderPro/samples | Out-Null
          Copy-Item tests/voice-samples/*.wav dist/VoiceReaderPro/samples/ -Force
          Copy-Item README.md dist/VoiceReaderPro/README.md -Force
      - name: Confirm output
        shell: pwsh
        run: |
          if (!(Test-Path dist/VoiceReaderPro/VoiceReaderPro.exe)) { throw 'EXE was not generated in the app folder' }
          if ((Get-Item dist/VoiceReaderPro/VoiceReaderPro.exe).Length -lt 1MB) { throw 'EXE launcher is unexpectedly small' }
          if (!(Test-Path dist/VoiceReaderPro/voices/v5_6_ru.pt)) { throw 'Local Silero voice model was not copied beside the EXE' }
          if ((Get-Item dist/VoiceReaderPro/voices/v5_6_ru.pt).Length -lt 50000000) { throw 'Local Silero model is unexpectedly small' }

          $extraFiles = @(
            'voices/teratts/teratts.py',
            'voices/teratts/models/text_encoder.onnx',
            'voices/teratts/models/duration_predictor.onnx',
            'voices/teratts/models/sampler_distilled_cfg3_8step.onnx',
            'voices/teratts/models/vocoder.onnx',
            'voices/teratts/styles/ru_m5/style_ttl.npy',
            'voices/teratts/styles/ru_m5/style_dp.npy',
            'voices/armenian/armenian_tri.yaml',
            'voices/armenian/armenian_reference.wav',
            'voices/armenian/tri_v1/model.safetensors',
            'voices/armenian/tri_v1/tokenizer_tri.model',
            'samples/young-pop-ru.wav',
            'samples/armenian-accent-ru.wav'
          )
          foreach ($relative in $extraFiles) {
            if (!(Test-Path (Join-Path 'dist/VoiceReaderPro' $relative))) {
              throw "Additional voice package is missing: $relative"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceReaderPro-Offline-Windows
          path: dist/VoiceReaderPro/
          if-no-files-found: error
          retention-days: 14
