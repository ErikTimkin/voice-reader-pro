<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voice Reader</title><style>body{margin:0;background:#111827;color:#f9fafb;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{width:min(92vw,560px);background:#1f2937;padding:28px;border-radius:20px;box-sizing:border-box}textarea{width:100%;min-height:150px;box-sizing:border-box;border:1px solid #4b5563;border-radius:12px;background:#111827;color:white;padding:14px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#6366f1;color:white;font-weight:700;font-size:16px;margin-top:12px}button:disabled{opacity:.5}#meta,#notice{color:#9ca3af;margin-top:10px}#notice{min-height:24px}</style><main class="card"><h1>Voice Reader</h1><p>Напишите сообщение — бот озвучит его в голосовом канале.</p><textarea id="text" maxlength="350" placeholder="Ваше сообщение"></textarea><div id="meta">0 / 350</div><button id="send">Озвучить</button><div id="notice" role="status"></div></main><script>const t=document.querySelector('#text'),b=document.querySelector('#send'),n=document.querySelector('#notice'),m=document.querySelector('#meta');t.oninput=()=>m.textContent=`${t.value.length} / 350`;b.onclick=async()=>{b.disabled=true;n.textContent='Отправляем…';try{let r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t.value})}),j=await r.json();n.textContent=j.message||'Готово';if(r.ok)t.value='',m.textContent='0 / 350'}catch(e){n.textContent='Нет связи с сервером'}finally{b.disabled=false}};</script></html>
